[project]
name = "self-github-issue-manager"
version = "0.1.0"
description = "Repository-scoped GitHub App OAuth MCP server"
requires-python = ">=3.12,<3.13"
dependencies = ["fastmcp>=2.14,<3", "httpx>=0.28,<1", "keyring>=25,<26", "filelock>=3.16,<4", "python-dotenv>=1,<2"]

[project.scripts]
issue-manager = "self_github_issue_manager.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
